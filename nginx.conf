# Carga del módulo
load_module /usr/lib/nginx/modules/ngx_http_dav_ext_module.so;

worker_processes auto;

# IMPORTANTE: El PID debe estar en una ruta escribible por el usuario
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    sendfile            on;
    keepalive_timeout   65;

    # Rutas temporales en carpetas del usuario
    client_body_temp_path /tmp/nginx_upload 1 2;
    client_body_in_file_only on;

    # Evitamos errores de permisos en logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server {
        listen      8080;
        listen      [::]:8080;
        server_name localhost;

        auth_basic "Acceso Privado";
        auth_basic_user_file /etc/nginx/.htpasswd;

        error_page  401              /html/401.html;
        error_page  404              /html/404.html;
        error_page  500 502 503 504  /html/50x.html;

        location = /401.html {
            root /usr/share/nginx/html;
            auth_basic off;
        }

        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        location / {
            root /data/;
            create_full_put_path on;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            charset utf-8;

            dav_methods PUT DELETE MKCOL COPY MOVE;
            dav_ext_methods PROPFIND OPTIONS;
            dav_access user:rw group:rw all:rw;

            client_max_body_size 0;
        }
    }
}
